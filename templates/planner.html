<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Study Planner</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(
                120deg,
                #e7f5ff,
                #e9fff7
            );

            min-height: 100vh;
            padding: 50px 8%;
            color: #102f4f;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #607d96;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd8e5;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1769aa;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #1769aa;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0d548c;
        }

        .result {
            margin-top: 40px;
            padding: 30px;
            background: #f4f9ff;
            border-radius: 15px;
            border-left: 5px solid #1769aa;
        }

        .result h2 {
            color: #1769aa;
            margin-bottom: 20px;
        }

        .ai-plan {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #263f56;
        }

        .error {
            margin-top: 25px;
            padding: 15px;
            background: #ffecec;
            color: #b00020;
            border-radius: 10px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769aa;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🤖 AI Study Planner</h1>

    <p class="subtitle">
        Let your AI Planner Agent create a personalized study schedule.
    </p>


    <form action="/planner" method="POST">

        <label>
            📚 Enter Your Subjects
        </label>

        <input
            type="text"
            name="subjects"
            placeholder="Example: DBMS, AI, Java, Web Development"
            required
        >


        <label>
            ⏰ Study Hours Per Day
        </label>

        <input
            type="number"
            name="hours"
            placeholder="Example: 4"
            min="1"
            max="12"
            required
        >


        <label>
            📅 Number of Days
        </label>

        <input
            type="number"
            name="days"
            placeholder="Example: 5"
            min="1"
            max="30"
            required
        >


        <button type="submit">

            🚀 Generate AI Study Plan

        </button>

    </form>


    {% if result %}

        {% if result.error %}

            <div class="error">

                ⚠️ {{ result.error }}

            </div>

        {% endif %}


        {% if result.ai_plan %}

            <div class="result">

                <h2>
                    🤖 AI Study Planner Result
                </h2>

                <p class="ai-plan">
                    {{ result.ai_plan }}
                </p>

            </div>

        {% endif %}

    {% endif %}


    <a href="/" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
